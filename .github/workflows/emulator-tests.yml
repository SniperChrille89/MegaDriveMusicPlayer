name: CPU Audio Engine (Z80)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/hardware/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/emulator-tests.yml'

jobs:
  real-z80:
    name: Real Z80 CPU -> audio bus -> VGM
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure with real Z80 core
        run: cmake -S . -B build-cpu -A x64 -DMDA_ENABLE_Z80=ON -DBUILD_TESTING=ON
      - name: Compile CPU backend and VGM exporter
        run: cmake --build build-cpu --config Release --parallel
      - name: Run CPU and timing tests
        run: ctest --test-dir build-cpu -C Release --output-on-failure
      - name: Generate test soundtrack from Z80 machine code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cpu-demo | Out-Null
          & './build-cpu/Release/mda_z80_generate_vgm.exe' 'cpu-demo/Z80_CPU_Demo.vgm'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'build-cpu/Release/mda_z80_generate_vgm.exe' cpu-demo/
          & './build-cpu/Release/mda_vgm_to_wav.exe' 'cpu-demo/Z80_CPU_Demo.vgm' 'cpu-demo/Z80_CPU_Demo.wav'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Include real-ROM Z80 bootstrap diagnostic
        shell: pwsh
        run: |
          Copy-Item 'build-cpu/Release/mda_s3k_z80_probe.exe' cpu-demo/
          Copy-Item 'build-cpu/Release/mda_vgm_to_wav.exe' cpu-demo/
          Copy-Item 'build-cpu/Release/mda_s3k_rom_scan.exe' cpu-demo/
          Set-Content -Path 'cpu-demo/TEST_ROM.txt' -Value @'
          This diagnostic needs a ROM you supply locally. No ROM is uploaded to GitHub.
          Open PowerShell in this directory and run:
          .\mda_s3k_rom_scan.exe "C:\path\to\Sonic3K.bin"
          .\mda_s3k_z80_probe.exe "C:\path\to\Sonic3K.bin" "driver_bootstrap_trace.vgm" 01 "driver_audio.wav"
          This checks original Z80 bootstrap execution, NOT full music playback.
          '@
      - name: Upload Z80 driver demo
        uses: actions/upload-artifact@v4
        with:
          name: Real-Z80-Audio-Demo
          path: cpu-demo/
          if-no-files-found: error
